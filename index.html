<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tip Calculator</title>
        <link rel="stylesheet" href="style.css">
        <style>
            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
                font-size: 16px;
                line-height: 1.5;
                color: #243047;
                background: #eef3f8;
            }

            .container {
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
            }

            .card {
                width: 100%;
                max-width: 420px;
                padding: 32px;
                background: #ffffff;
                border-radius: 16px;
                box-shadow: 0 12px 32px rgba(36, 48, 71, 0.12);
            }

            h1 {
                margin: 0 0 24px;
                font-size: 1.75rem;
                font-weight: 600;
            }

            label {
                display: block;
                margin-bottom: 8px;
                font-weight: 600;
            }

            input,
            select {
                width: 100%;
                margin-bottom: 16px;
                padding: 12px 14px;
                border: 1px solid #d5deea;
                border-radius: 10px;
                font: inherit;
                background: #f8fafc;
            }

            button {
                width: 100%;
                margin: 8px 0 20px;
                padding: 12px 16px;
                border: none;
                border-radius: 10px;
                font: inherit;
                font-weight: 600;
                color: #ffffff;
                background: #3b82f6;
                cursor: pointer;
            }

            #result-area {
                padding-top: 8px;
            }

            #result-area p {
                margin: 8px 0 0;
            }

            #error-message {
                margin: 0 0 8px;
                color: #b42318;
                font-weight: 600;
            }

            #error-message:empty {
                display: none;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="card">
                <h1>Tip Calculator</h1>
                <label for="bill-amount">Bill amount</label>
                <input type="number" id="bill-amount" placeholder="Enter bill amount">
                <label for="tip-percent">Tip percent</label>
                <select id="tip-percent">
                    <option value="10">10%</option>
                    <option value="15">15%</option>
                    <option value="20">20%</option>
                </select>
                <label for="number-of-people">Number of people</label>
                <input type="number" id="number-of-people" placeholder="Enter number of people">
                <button id="calculate-button">Calculate</button>
                <div id="result-area">
                    <p id="error-message"></p>
                    <p>Tip Amount: <span id="tip-amount">$0.00</span></p>
                    <p>Total Amount: <span id="total-amount">$0.00</span></p>
                    <p>Total per person: <span id="total-per-person">$0.00</span></p>
                </div>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
